name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências do workspace
        run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed apps packages

      - name: Análise
        run: flutter analyze

      - name: Testes — beyond_protocol
        working-directory: packages/beyond_protocol
        run: dart test

      - name: Testes — server
        working-directory: apps/server
        run: dart test

      - name: Testes — dashboard
        working-directory: apps/dashboard
        run: flutter test

      - name: Testes — tv
        working-directory: apps/tv
        run: flutter test

  build-apk:
    name: APK de debug
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        working-directory: apps/tv
        run: flutter build apk --debug

      # Para instalar numa TV de teste sem compilar localmente.
      - name: Publica o APK
        uses: actions/upload-artifact@v4
        with:
          name: beyond-tv-debug-apk
          path: apps/tv/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  gitleaks:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # a action lista os commits do PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
